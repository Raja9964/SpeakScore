<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Self-intro Scorer</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; max-width: 900px; }
    textarea { width:100%; height:220px; }
    pre { background:#f6f6f6; padding:10px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Self-introduction Scorer</h1>
  <p>Paste the transcript below and click <b>Score</b>.</p>
  <textarea id="transcript"></textarea><br/><br/>
  <button id="scoreBtn">Score</button>
  <h3>Result (JSON)</h3>
  <pre id="result">No result yet.</pre>

<script>
document.getElementById('scoreBtn').onclick = async () => {
  const t = document.getElementById('transcript').value;
  document.getElementById('result').innerText = "Scoring...";
  try {
    const resp = await fetch('/score', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({transcript: t})
    });
    const json = await resp.json();
    document.getElementById('result').innerText = JSON.stringify(json, null, 2);
  } catch (e) {
    document.getElementById('result').innerText = "Error: "+e;
  }
};
</script>
</body>
</html>
